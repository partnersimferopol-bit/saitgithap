html { scroll-behavior: smooth; }

}

.menu {

}
.menu a { display: block; text-decoration: none; padding: 8px 12px; border-radius: 8px; font-size: 14px; }

.mobile {

label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 12px; }
input, select, textarea {
  width: 100%; margin-top: 6px; min-height: 48px; border-radius: 12px; border: 1px solid var(--line);

textarea { min-height: 120px; resize: vertical; }
.err { color: var(--danger); font-size: 12px; font-weight: 500; }
.fine { font-size: 12px; color: var(--muted); }
footer { background: var(--ink); color: var(--cream); padding: 48px 0 20px; }
.foot { display: grid; gap: 28px; }

.legal { border-top: 1px solid color-mix(in srgb, var(--cream) 12%, transparent); margin-top: 28px; padding-top: 16px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 12px; color: color-mix(in srgb, var(--cream) 50%, transparent); }
@media (min-width: 760px) {

@media (max-width: 759px) {
  .mobile.open { display: block; }
  .hero::after { display: none; }

    <p class="kicker">Екатерина Зверева · независимый эксперт</p>
    <h1>ХАССП, ППК, ТУ и декларации о соответствии для пищевых предприятий по всей России</h1>

    <div class="actions"><a class="btn primary" href="#/kontakty">Получить консультацию</a><a class="btn ghost" href="#/kontakty?topic=Бесплатный экспресс-аудит">Бесплатный экспресс-аудит</a></div>
    <ul class="badges"><li>Вся Россия</li><li>ISO 22000</li><li>ГОСТ Р 51705.1-2024</li><li>Дистанционно и с выездом</li></ul>
  </div><aside class="panel"><p class="kicker">Не лендинг одной услуги</p><h2 style="font-size:1.7rem">Комплексное нормативное обеспечение пищевой безопасности</h2><ul><li>Отдельные страницы под каждую услугу и отрасль</li><li>Личный бренд независимого эксперта, а не «компании по ХАССП»</li><li>Документы, которые живут в цехе, а не только в папке к проверке</li></ul></aside></div></section>
  <section class="block wrap"><p class="kicker">Услуги</p><h2>Не только ХАССП — полный контур пищевой безопасности</h2><p class="intro">Каждое направление — отдельная страница, чтобы было видно, как услуга стыкуется с остальными документами предприятия.</p><div class="cards">${services.map(s => `<article class="card"><h3>${esc(s[1])}</h3><p>${esc(s[2])}</p><a class="more" href="#/uslugi/${s[0]}">Подробнее</a></article>`).join('')}</div></section>
  <section class="band"><div class="wrap block"><p class="kicker">Ситуации</p><h2>Когда предприятию нужен не шаблон, а эксперт</h2><div class="cards">${[["Документы есть, а на проверке — замечания","Шаблоны из интернета не совпадают с вашими процессами. Инспектор видит расхождение за первые полчаса."],["Нужно «внедрить ХАССП», но непонятно с чего начать","ХАССП, ППК, ТУ и декларации связаны. Если собирать их по отдельности, система разваливается."],["Сеть или покупатель запросили ISO 22000","Сертификация не проходит, если записи не живут в ежедневной работе."],["Сменился ассортимент, цех или поставщик","ППК и ТУ устаревают быстрее, чем кажется. Актуализация дешевле переделки после предписания."]].map(([t,d]) => `<article class="card"><h3>${esc(t)}</h3><p>${esc(d)}</p></article>`).join('')}</div></div></section>
  <section class="block wrap"><p class="kicker">Как устроена работа</p><h2>От диагностики до сопровождения</h2><div class="steps">${[["01","Диагностика","Экспресс-аудит документов и процессов: что уже работает и какой комплект нужен."],["02","Проектирование","Структура документов под фактическую схему производства."],["03","Разработка","ХАССП, ППК, ТУ или пакет к декларации — рабочими формулировками."],["04","Внедрение","Обучение, запуск записей, выезд или дистанционное сопровождение."],["05","Сопровождение","Актуализация, внутренний аудит и подготовка к проверке."]].map(([n,t,d]) => `<article class="step"><p class="n">${n}</p><h3>${t}</h3><p>${d}</p></article>`).join('')}</div></section>
  <section class="band-ink"><div class="wrap block"><p class="kicker">Квалификация</p><h2>Действующие сертификаты и практика внедрения</h2><div class="quad four">${[["ISO 22000:2018","Действующий сертификат специалиста. Внедрение СМБПП и подготовка к сертификации."],["ГОСТ Р 51705.1-2024","Действующий сертификат и опыт внедрения ХАССП на производствах и в общепите."],["ТР ТС 021 / 022 / 029","Декларации, маркировка и доказательная база для выпуска продукции в оборот."],["Вся Россия","Дистанционно и с выездом. Производство, переработка и общественное питание."]].map(([t,d]) => `<article class="tile dark"><h3>${t}</h3><p>${d}</p></article>`).join('')}</div></div></section>
  <section class="block wrap"><p class="kicker">Отрасли</p><h2>Производство, переработка и общественное питание</h2><div class="cards industries">${Object.entries(industries).map(([id,v]) => `<a class="card" href="#/otrasli/${id}" style="text-decoration:none"><h3>${esc(v[0])}</h3><p>${esc(v[1])}</p><span class="more">Смотреть направление</span></a>`).join('')}</div></section>
  <section class="band"><div class="wrap block"><p class="kicker">Вопросы</p><h2>Коротко о формате работы</h2><div class="faq" id="faq">${faqs.map((f,i) => `<button type="button" data-i="${i}">${esc(f[0])}</button><p hidden>${esc(f[1])}</p>`).join('')}</div></div></section>
  ${cta()}`;
}
function servicePage(id) {
  const s = svc(id); if (!s) return missing();
  const others = services.filter(x => x[0] !== id);
  return `<section class="page-hero"><div class="wrap"><p class="kicker">Услуга</p><h1>${esc(s[1])}</h1><p class="lead">${esc(s[3])}</p></div></section>
  <section class="block wrap split" style="display:grid;gap:36px"><div><p class="intro">${esc(s[2])}</p><h2 style="margin-top:28px;font-size:1.6rem">Что входит в работу</h2><ul class="checks">${s[5].map(p => `<li><i>✓</i><span>${esc(p)}</span></li>`).join('')}</ul><div class="result"><p class="kicker">Результат</p><p>${esc(s[4])}</p><p class="fine">${esc(s[6])}</p></div></div><div><h2 style="font-size:1.4rem">Заявка по этой услуге</h2>${form(s[1])}</div></section>
  <section class="block wrap" style="padding-top:0"><h2 style="font-size:1.6rem">Связанные направления</h2><div class="cards">${others.map(o => `<a class="card" href="#/uslugi/${o[0]}" style="text-decoration:none"><h3>${esc(o[1])}</h3></a>`).join('')}</div></section>${cta()}`;
}

  <section class="block wrap split" style="display:grid;gap:36px"><div>${v[2].map(p => `<p class="intro">${esc(p)}</p>`).join('')}<ul class="checks">${v[3].map(p => `<li><i>✓</i><span>${esc(p)}</span></li>`).join('')}</ul></div>
  <aside><h2 style="font-size:1.6rem">Типовые задачи</h2><ul class="checks">${v[4].map(p => `<li><span>${esc(p)}</span></li>`).join('')}</ul><h2 style="font-size:1.6rem;margin-top:28px">Релевантные услуги</h2><div class="cards">${v[5].map(sid => `<a class="card" href="#/uslugi/${sid}" style="text-decoration:none"><h3>${esc(svc(sid)[1])}</h3></a>`).join('')}</div></aside></section>${cta()}`;
}
function about() {
  return `<section class="page-hero"><div class="wrap"><p class="kicker">Об эксперте</p><h1>Личный экспертный бренд, а не ещё одна компания «по внедрению ХАССП»</h1><p class="lead">Екатерина Зверева сопровождает пищевые предприятия по всей России: от программы производственного контроля и технических условий до системы менеджмента по ISO 22000.</p></div></section>
  <section class="block wrap split" style="display:grid;gap:36px"><div><h2>Почему такой формат сильнее типового подрядчика</h2><p class="intro">Компании, которые продают только внедрение ХАССП, оставляют предприятие с разрозненными ТУ, ППК и декларацией. На проверке это видно сразу.</p><p class="intro">Комплексное сопровождение собирает контур целиком: декларация опирается на ТУ, ТУ — на рецептуру, ХАССП — на реальные ККТ, ППК — на лабораторный контроль. ISO 22000 подключается, когда нужна сертификация.</p><p class="intro">География — вся Россия. Основной формат дистанционный, выезд — когда без осмотра цеха нельзя корректно описать опасности.</p></div>
  <aside class="card"><p class="kicker">Компетенции</p><h3>ISO 22000:2018</h3><p>Действующий сертификат. Внедрение СМБПП.</p><h3>ГОСТ Р 51705.1-2024</h3><p>Сертификат и опыт внедрения ХАССП.</p><h3>ТР ТС 021 / 022 / 029</h3><p>Декларации, маркировка, доказательная база.</p></aside></section>${cta()}`;
}
function contacts(topic) {
  return `<section class="block wrap split" style="display:grid;gap:36px"><div><p class="kicker">Контакты</p><h1 style="font-size:clamp(2rem,4vw,3rem)">Опишите предприятие — предложу понятный следующий шаг</h1><p class="intro">Консультация и экспресс-аудит документов. Укажите тип объекта, ассортимент и что уже есть: ППК, ХАССП, ТУ, декларации.</p><div class="cards" style="margin-top:20px"><article class="card"><p>География: вся Россия</p></article><article class="card"><p>Формат: дистанционно и с выездом</p></article></div></div><div>${form(topic || 'Консультация')}</div></section>`;
}
function privacy() {
  return `<article class="block wrap" style="max-width:760px"><h1>Политика конфиденциальности</h1><p class="intro">Политика описывает сведения, которые вы оставляете в форме обратной связи на сайте Екатерины Зверевой.</p><h2>Какие данные собираются</h2><p class="intro">Имя, название организации, контакт для связи и описание задачи.</p><h2>Для чего используются данные</h2><p class="intro">Только чтобы ответить на заявку и предложить условия консультации или разработки документов. Рассылки третьим лицам не формируются.</p><h2>Срок хранения</h2><p class="intro">Данные хранятся, пока ведётся переписка, и удаляются после завершения работы либо по вашей просьбе.</p><p class="fine">В этом HTML-файле заявка не уходит на сервер: она остаётся только на экране вашего браузера.</p></article>`;
}
function missing() { return `<section class="block wrap"><h1>Страница не найдена</h1><p><a href="#/">На главную</a></p></section>`; }
function bind() {
  const f = document.getElementById('lead');
  if (f) f.addEventListener('submit', e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(f));
    if ((data.name||'').trim().length < 2 || (data.message||'').trim().length < 10) {
      document.getElementById('ferr').textContent = 'Заполните имя и опишите задачу чуть подробнее.';
      return;
    }
    f.outerHTML = `<div class="ok"><h2>Заявка принята</h2><p class="intro">Спасибо. В этой версии сайта данные никуда не отправляются. Перешлите Екатерине имя, организацию и текст задачи — или оставьте заявку после публикации сайта.</p></div>`;
  });
  const faq = document.getElementById('faq');
  if (faq) faq.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const p = b.nextElementSibling;
    const open = p.hidden;
    faq.querySelectorAll('p').forEach(x => x.hidden = true);
    p.hidden = !open;
  });
  document.querySelectorAll('#mobile a').forEach(a => a.addEventListener('click', () => document.getElementById('mobile').classList.remove('open')));
}
function render() {
  const raw = (location.hash || '#/').slice(1);
  const [path, query] = raw.split('?');
  const topic = new URLSearchParams(query || '').get('topic');
  const parts = path.split('/').filter(Boolean);
  let html = home();
  if (parts[0] === 'o-specialiste') html = about();
  else if (parts[0] === 'kontakty') html = contacts(topic);
  else if (parts[0] === 'politika') html = privacy();
  else if (parts[0] === 'uslugi' && parts[1]) html = servicePage(parts[1]);
  else if (parts[0] === 'otrasli' && parts[1]) html = industryPage(parts[1]);
  document.getElementById('app').innerHTML = html;
  document.title = parts.length ? 'Екатерина Зверева — пищевая безопасность' : 'Екатерина Зверева — ХАССП, ППК, ТУ и декларации';
  bind();
  window.scrollTo(0, 0);
}
document.getElementById('year').textContent = new Date().getFullYear();
document.getElementById('burger').addEventListener('click', () => document.getElementById('mobile').classList.toggle('open'));
nav();
window.addEventListener('hashchange', render);
render();
</script>
